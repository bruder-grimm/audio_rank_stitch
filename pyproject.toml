[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audiorankstitch"
version = "0.1.0"
description = "Audio recording, transcription, and stitching tool"
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [
    {name = "Marvin Grimm", email = "mrvn.grimm@gmail.com"},
    {name = "Christoph Zeckel", email = "derechtepanda@gmail.com"},
]

dependencies = [
    "pydub>=0.25.1",
    "numpy>=2.0",
    "sounddevice>=0.5.0",
    "pynput>=1.7.6",
    "pyannote-audio==4.0.4",
    "pyannote-core==6.0.1",
    "pyannote-database==6.1.1",
    "pyannote-metrics==4.1",
    "pyannote-pipeline==4.0.0",
    "pyannoteai-sdk==0.4.0",
    "whisperx>=3.0.1",
    "pyloudnorm>=0.2.0",
    "audiocomplib>=0.2.0",
    "flask>=3.0.0",
    "matplotlib>=3.10.9",
    "transformers==4.57.6",
    "spacy==3.8.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=24.0",
    "ruff>=0.2.0",
]

[project.scripts]
audio-rank-stitch = "main:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']

[tool.ruff]
line-length = 100
target-version = "py311"
